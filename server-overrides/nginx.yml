services:
  nginx-proxy:
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - /home/data/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/data/config/nginx/conf.d:/etc/nginx/conf.d
      - /home/data/runtime/nginx/log:/var/log/nginx
      - /home/data/runtime/nginx/html:/usr/share/nginx/html
      - /home/data/certificates/acme.sh:/root/.acme.sh:ro
