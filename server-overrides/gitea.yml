services:
  web:
    environment:
      OAUTH2_GITHUB_CLIENT_ID: ${OAUTH2_GITHUB_CLIENT_ID}
      OAUTH2_GITHUB_CLIENT_SECRET: ${OAUTH2_GITHUB_CLIENT_SECRET}
      GITEA__server__SSH_PORT: ${GITEA__server__SSH_PORT}
    volumes:
      - /home/data/runtime/gitea/data:/data
    ports: ["9922:22"]
  gitea-runner:
    depends_on: [web]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/data/runtime/gitea/runner-data:/data
