version: "3"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JENKINS_DATA_DIR:?JENKINS_DATA_DIR must be set}:/var/jenkins_home
    expose:
      - 8080
      - 50000
    networks:
      - nginx_proxy

networks:
  nginx_proxy:
    external: true
